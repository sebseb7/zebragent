name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. Go Setup & Caching ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: service/go.sum

      # --- 2. Cache Compiled ZebraAgent.exe Binary ---
      - name: Cache ZebraAgent binary
        id: cache-agent
        uses: actions/cache@v4
        with:
          path: service/ZebraAgent.exe
          key: ${{ runner.os }}-zebra-agent-${{ hashFiles('service/**/*.go', 'service/go.mod', 'service/go.sum') }}

      - name: Build ZebraAgent binary
        if: steps.cache-agent.outputs.cache-hit != 'true'
        working-directory: service
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o ZebraAgent.exe .
          if (!(Test-Path ZebraAgent.exe)) {
            Write-Error "ZebraAgent.exe build failed."
            exit 1
          }

      # --- 3. Node.js Setup & Caching ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      # --- 4. Rust Setup & Cargo Caching ---
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-all-crates: true

      # --- 5. Build Tauri v2 Release Binary ---
      - name: Build Tauri v2 UI
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if (!(Test-Path src-tauri\target\release\zebra-agent-ui.exe)) {
            Write-Error "zebra-agent-ui.exe build failed."
            exit 1
          }

      # --- 6. Prepare Dist Artifacts ---
      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "src-tauri\target\release\zebra-agent-ui.exe" -Destination "dist\zebra-agent-ui.exe"
          Copy-Item "service\ZebraAgent.exe" -Destination "dist\ZebraAgent.exe"
          Get-ChildItem dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zebra-agent-windows
          path: dist/*
          if-no-files-found: error

      # --- 7. Create GitHub Release on Tag (v*) ---
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zebra-agent-ui.exe
            dist/ZebraAgent.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

