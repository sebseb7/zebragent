name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Stage (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- 1. Go Setup & Caching ---
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      # --- 2. Cache Compiled ZebraAgent.exe Binary ---
      - name: Cache ZebraAgent binary
        id: cache-agent
        uses: actions/cache@v6
        with:
          path: service/ZebraAgent.exe
          key: ${{ runner.os }}-zebra-agent-${{ hashFiles('service/**/*.go', 'service/go.mod', 'service/go.sum') }}

      - name: Build ZebraAgent binary
        if: steps.cache-agent.outputs.cache-hit != 'true'
        working-directory: service
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o ZebraAgent.exe .
          if (!(Test-Path ZebraAgent.exe)) {
            Write-Error "ZebraAgent.exe build failed."
            exit 1
          }

      # --- 3. Node.js Setup & Caching ---
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      # --- 4. Rust Setup & Cargo Caching ---
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-all-crates: true

      # --- 5. Build Tauri v2 Release Binary ---
      - name: Build Tauri v2 UI
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if (!(Test-Path src-tauri\target\release\zebra-agent-ui.exe)) {
            Write-Error "zebra-agent-ui.exe build failed."
            exit 1
          }

      # --- 6. Prepare Dist Artifacts ---
      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "src-tauri\target\release\zebra-agent-ui.exe" -Destination "dist\zebra-agent-ui.exe"
          Copy-Item "service\ZebraAgent.exe" -Destination "dist\ZebraAgent.exe"
          Get-ChildItem dist

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zebra-agent-windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Service (Linux Static)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- 1. Go Setup & Caching ---
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache: true
          cache-dependency-path: service/go.sum

      # --- 2. Cache Compiled zebragent Binary ---
      - name: Cache zebragent binary
        id: cache-agent
        uses: actions/cache@v6
        with:
          path: service/zebragent-linux-amd64
          key: ${{ runner.os }}-zebra-agent-${{ hashFiles('service/**/*.go', 'service/go.mod', 'service/go.sum') }}

      - name: Build zebragent binary (Linux Static)
        if: steps.cache-agent.outputs.cache-hit != 'true'
        working-directory: service
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o zebragent-linux-amd64 .
          test -f zebragent-linux-amd64

      # --- 3. Stage & Upload Linux Artifact ---
      - name: Stage Linux Artifact
        run: |
          mkdir -p dist
          cp service/zebragent-linux-amd64 dist/zebragent-linux-amd64
          chmod +x dist/zebragent-linux-amd64

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zebra-agent-linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zebra-agent-*
          merge-multiple: true
          path: dist

      - name: Verify release artifacts
        run: |
          ls -la dist/
          test -f dist/zebra-agent-ui.exe
          test -f dist/ZebraAgent.exe
          test -f dist/zebragent-linux-amd64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/zebra-agent-ui.exe
            dist/ZebraAgent.exe
            dist/zebragent-linux-amd64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
