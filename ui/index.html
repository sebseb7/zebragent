<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zebra Agent Manager</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header" style="margin-bottom: 14px; padding-bottom: 12px;">
      <div class="header-brand">
        <div class="header-icon" style="display: flex; align-items: center; justify-content: center;">
          <img src="icon.png" alt="QZ" style="width: 32px; height: 32px; border-radius: 7px; box-shadow: 0 2px 6px rgba(0,0,0,0.35);" />
        </div>
        <div class="header-title">
          <h1>Zebra Agent Manager</h1>
        </div>
      </div>
      <div class="header-actions">
        <div id="sseStatusPill" class="status-pill offline" title="SSE Service Runner Status">
          <span class="status-dot"></span>
          <span id="sseStatusText">SSE Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <div style="display: flex; flex-direction: column; gap: 14px; flex: 1; overflow: hidden;">
      <!-- Row 1: 3 dedicated cards: Settings | Service | Pairing -->
      <div style="display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 14px;">
        <!-- Card 1: Configuration -->
        <div class="card" style="margin-bottom: 0;">
          <form id="regForm" onsubmit="return false;">
            <div class="form-grid">
              <div class="form-group form-group-full">
                <label for="inputApiUrl">QuixPOS API URL</label>
                <input type="text" id="inputApiUrl" placeholder="http://localhost:4209" autocomplete="off" />
              </div>
              <div class="form-group form-group-full">
                <label for="inputPrinterIp">ZPL Printer IP</label>
                <input type="text" id="inputPrinterIp" placeholder="192.168.188.47" autocomplete="off" />
              </div>
              <div class="form-group form-group-full">
                <label for="inputPort">local Service port</label>
                <input type="number" id="inputPort" placeholder="41783" min="1024" max="65535" autocomplete="off" />
              </div>
            </div>
            <div style="margin-top: 14px;" class="btn-group">
              <button id="btnSaveRegistry" type="button" class="btn btn-primary btn-sm">
                💾 Save
              </button>
            </div>
          </form>
        </div>

        <!-- Card 2: Background Service (strictly only the 3 items) -->
        <div class="card" style="margin-bottom: 0; display: flex; flex-direction: column; justify-content: space-between;">
          <div class="card-header" style="margin-bottom: 12px;">
            <h2 class="card-title">Background Service</h2>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem;">
              <span style="font-weight: 600;">Running:</span>
              <span id="statRunning" class="status-pill offline" style="padding: 3px 12px;">no</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem;">
              <span style="font-weight: 600;">Background:</span>
              <span id="statBackground" class="status-pill offline" style="padding: 3px 12px;">no</span>
            </div>
          </div>
          <div style="margin-top: 14px;">
            <button id="btnToggleService" class="btn btn-primary" style="width: 100%; padding: 9px 12px; font-size: 0.88rem;">
              Install as background service
            </button>
          </div>
        </div>

        <!-- Card 3: Pairing -->
        <div class="card" style="margin-bottom: 0; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem;">
              <span style="font-weight: 600;">Paired:</span>
              <span id="statPaired" class="status-pill offline" style="padding: 3px 12px;">no</span>
            </div>
            <!-- When Unpaired: PIN input & Pair button -->
            <div id="pairControlBox" style="display: flex; gap: 8px;">
              <input type="text" id="inputPairPin" placeholder="6-digit PIN" style="font-size: 0.88rem; padding: 7px 10px; width: 62%; font-family: var(--font-mono);" autocomplete="off" />
              <button id="btnPairAgent" class="btn btn-primary btn-sm" style="flex: 1;">
                Pair
              </button>
            </div>
            <!-- When Paired: Unpair button -->
            <div id="unpairControlBox" style="display: none;">
              <button id="btnUnpairAgent" class="btn btn-danger btn-sm" style="width: 100%; padding: 8px 12px;">
                Unpair Agent
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: Live Output -->
      <div class="card" style="margin-bottom: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="card-header" style="margin-bottom: 8px; justify-content: flex-end;">
          <button id="btnClearLog" class="btn btn-secondary btn-sm" title="Clear Console">
            🗑️ Clear
          </button>
        </div>
        <div id="logTerminal" class="log-terminal" style="flex: 1; height: 100%; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.45; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="main.js"></script>
</body>
</html>
