<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zebra Agent Manager</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header" style="margin-bottom: 14px; padding-bottom: 12px;">
      <div class="header-brand">
        <div class="header-icon" style="display: flex; align-items: center; justify-content: center;">
          <img src="icon.png" alt="QZ" style="width: 32px; height: 32px; border-radius: 7px; box-shadow: 0 2px 6px rgba(0,0,0,0.35);" />
        </div>
        <div class="header-title">
          <h1>Zebra Agent Manager</h1>
        </div>
      </div>
      <div class="header-actions">
        <div id="sseStatusPill" class="status-pill offline" title="SSE Service Runner Status">
          <span class="status-dot"></span>
          <span id="sseStatusText">SSE Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Main Content Grid -->
    <div style="display: flex; flex-direction: column; gap: 14px; flex: 1; overflow: hidden;">
      <!-- Row 1: 4 dedicated cards: Connection Settings | ZPL Printers | Service | Pairing -->
      <div style="display: grid; grid-template-columns: 1.25fr 1.25fr 0.85fr 0.9fr; gap: 12px;">
        <!-- Card 1: Connection Settings (Upstream URL & Downstream SSE Port) -->
        <div class="card" style="margin-bottom: 0; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
          <form id="regForm" onsubmit="return false;" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div class="form-group">
                <label for="inputApiUrl">QuixPOS API URL</label>
                <input type="text" id="inputApiUrl" placeholder="https://dashdemo.quixpos.com" autocomplete="off" style="font-size: 0.82rem; padding: 7px 10px;" />
              </div>
              <div class="form-group">
                <label for="inputPort">local Service port</label>
                <input type="number" id="inputPort" placeholder="41783" min="1024" max="65535" autocomplete="off" style="font-size: 0.84rem; padding: 7px 10px;" />
              </div>
            </div>
            <div style="margin-top: 12px;" class="btn-group">
              <button id="btnSaveRegistry" type="button" class="btn btn-primary btn-sm">
                💾 Save
              </button>
            </div>
          </form>
        </div>

        <!-- Card 2: ZPL Printers -->
        <div class="card" style="margin-bottom: 0; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label style="margin-bottom: 0;">zplprinters</label>
              <div style="display: flex; gap: 6px; align-items: center;">
                <button type="button" id="btnScanZplPrinters" class="btn btn-secondary btn-sm" style="font-size: 0.72rem; padding: 2px 8px; line-height: 1.2;" title="Scan local network for ZPL printers (TCP 9100)">
                  🔍 Scan
                </button>
                <button type="button" id="btnAddZplPrinter" class="btn btn-outline btn-sm" style="font-size: 0.72rem; padding: 2px 7px; line-height: 1.2;">
                  + Add
                </button>
              </div>
            </div>
            <div id="scanResultsBox" style="display: none; flex-direction: column; gap: 4px; margin-bottom: 6px; padding: 6px 8px; background: rgba(15, 23, 42, 0.85); border: 1px solid var(--accent); border-radius: var(--radius-sm); max-height: 115px; overflow-y: auto;">
            </div>
            <div id="zplPrintersList" style="display: flex; flex-direction: column; gap: 8px; max-height: 145px; overflow-y: auto; padding-right: 2px;">
              <!-- Dynamic ZPL printer rows -->
            </div>
          </div>
          <div style="margin-top: 12px;" class="btn-group">
            <button id="btnSavePrinters" type="button" class="btn btn-primary btn-sm">
              💾 Save
            </button>
          </div>
        </div>

        <!-- Card 3: Background Service (strictly only the 3 items) -->
        <div class="card" style="margin-bottom: 0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;">
          <div class="card-header" style="margin-bottom: 12px;">
            <h2 class="card-title">Background Service</h2>
          </div>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem;">
              <span style="font-weight: 600;">Running:</span>
              <span id="statRunning" class="status-pill offline" style="padding: 3px 12px;">no</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem;">
              <span style="font-weight: 600;">Background:</span>
              <span id="statBackground" class="status-pill offline" style="padding: 3px 12px;">no</span>
            </div>
          </div>
          <div style="margin-top: 14px;">
            <button id="btnToggleService" class="btn btn-primary" style="width: 100%; padding: 9px 12px; font-size: 0.88rem;">
              Install as background service
            </button>
          </div>
        </div>

        <!-- Card 4: Pairing -->
        <div class="card" style="margin-bottom: 0; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 10px 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem;">
              <span style="font-weight: 600; flex-shrink: 0;">Paired:</span>
              <span id="statPaired" class="status-pill offline" style="padding: 3px 10px; font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 145px;">no</span>
            </div>
            <!-- When Unpaired: PIN input & Pair button -->
            <div id="pairControlBox" style="display: flex; gap: 6px;">
              <input type="text" id="inputPairPin" placeholder="6-digit PIN" style="font-size: 0.82rem; padding: 7px 9px; flex: 1; min-width: 0; font-family: var(--font-mono);" autocomplete="off" />
              <button id="btnPairAgent" class="btn btn-primary btn-sm" style="padding: 6px 12px; flex-shrink: 0;">
                Pair
              </button>
            </div>
            <!-- When Paired: Unpair button -->
            <div id="unpairControlBox" style="display: none;">
              <button id="btnUnpairAgent" class="btn btn-danger btn-sm" style="width: 100%; padding: 8px 12px;">
                Unpair Agent
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: Live Output -->
      <div class="card" style="margin-bottom: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="card-header" style="margin-bottom: 8px; justify-content: flex-end;">
          <button id="btnClearLog" class="btn btn-secondary btn-sm" title="Clear Console">
            🗑️ Clear
          </button>
        </div>
        <div id="logTerminal" class="log-terminal" style="flex: 1; height: 100%; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.45; overflow-y: auto;"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="main.js"></script>
</body>
</html>
